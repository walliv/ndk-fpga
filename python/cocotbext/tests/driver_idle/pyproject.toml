[project]
name = "cocotb-driver-idle-test"
version = "0.1.0"
dependencies = [
    "cocotb >= 2.0.0",
    "cocotbext-ofm @ ${NDK_FPGA_COCOTBEXT_OFM_URL}",
    "setuptools",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
